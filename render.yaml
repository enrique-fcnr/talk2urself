# Render Blueprint: one free web service serves the page, the API and the WebSockets.
# Values marked "sync: false" are asked for when the Blueprint is created (paste them in Render's dashboard).
services:
  - type: web
    name: talk2urself
    runtime: node
    plan: free
    branch: feat/kelly-avatar
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node --import tsx apps/server/src/index.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_VOICE_ID
        sync: false
      # 1 = replies in silence without calling Cartesia; 0 = voice on.
      - key: CARTESIA_PAUSED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: LOCAL_USER_ID
        sync: false
