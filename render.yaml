# Render Blueprint: one free web service serves the page, the API and the WebSockets.
# Values marked "sync: false" are asked for when the Blueprint is created (paste them in Render's dashboard).
services:
  - type: web
    name: talk2urself
    runtime: node
    plan: free
    branch: feat/kelly-avatar
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node --import tsx apps/server/src/index.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: CARTESIA_API_KEY
        sync: false
      # Default voices (Cartesia voice ids, not secrets): "Padrão - PT-BR" and "Padrão - EN-US".
      - key: CARTESIA_VOICE_ID
        value: 5ccec9eb-c863-46d7-ade4-700406100e25
      - key: CARTESIA_VOICE_ID_EN
        value: 70b8d7de-e844-40f7-95a8-bb7b977f49d8
      # 1 = replies in silence without calling Cartesia; 0 = voice on.
      - key: CARTESIA_PAUSED
        value: "1"
      # Voice cloning (docs/clonagem-de-voz.md): set to "1" together with CARTESIA_PAUSED "0" on a Cartesia plan with cloning.
      - key: VOICE_CLONING
        value: "0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: LOCAL_USER_ID
        sync: false
